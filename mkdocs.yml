site_name: flaskit
site_description: CLI scaffolding for Flask-Smorest APIs with modular resources, Swagger, logging, and Docker.
site_url: https://flaskit.readthedocs.io/
repo_url: https://github.com/mghorbani2357/flaskit
edit_uri: edit/master/docs/

theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - python
    - yaml
    - bash
    - dockerfile
  navigation_depth: 3
  collapse_navigation: false
  sticky_navigation: true
  include_homepage_in_sidebar: true
  prev_next_buttons_location: bottom

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick start: quickstart.md
  - CLI reference: cli.md
  - Architecture: architecture.md
  - Modules: modules.md
  - Customizing the app: extending.md
  - Configuration: configuration.md
  - Logging: logging.md
  - Swagger UI: swagger.md
  - Static files: statics.md
  - Runtime: runtime.md
  - Docker: docker.md
  - OpenTelemetry: opentelemetry.md
  - Publish: publishing.md

plugins:
  - search
