site_name: flaskit
site_description: CLI scaffolding for Flask-Smorest APIs with modular resources, Swagger, logging, and Docker.
site_url: https://flaskit.readthedocs.io/
repo_url: https://github.com/mghorbani2357/flaskit
edit_uri: edit/master/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick start: quickstart.md
  - CLI reference: cli.md
  - Architecture: architecture.md
  - Modules: modules.md
  - Customizing the app: extending.md
  - Configuration: configuration.md
  - Logging: logging.md
  - Swagger UI: swagger.md
  - Static files: statics.md
  - Runtime: runtime.md
  - Docker: docker.md
  - OpenTelemetry: opentelemetry.md
  - Publish: publishing.md

plugins:
  - search
