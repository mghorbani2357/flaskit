[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flaskit"
version = "0.1.0"
description = "CLI scaffolding tool for Flask-Smorest projects with modular resources and Swagger definitions"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [{ name = "flaskit contributors" }]
keywords = ["flask", "smorest", "cli", "scaffold", "openapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "click>=8.1",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "pymdown-extensions>=10.0",
]

[project.scripts]
flaskit = "flaskit.cli:main"

[project.urls]
Homepage = "https://github.com/flaskit/flaskit"
Documentation = "https://flaskit.readthedocs.io/"

[tool.setuptools.packages.find]
include = ["flaskit*"]

[tool.setuptools.package-data]
flaskit = ["templates/**/*"]
