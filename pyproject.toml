[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flaskit-cli"
dynamic = ["version"]
description = "CLI scaffolding tool for Flask-Smorest projects with modular resources and Swagger definitions"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "flaskit contributors" }]
keywords = ["flask", "smorest", "cli", "scaffold", "openapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "click>=8.1",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build>=1.0"]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "pymdown-extensions>=10.0",
]
test = [
    "pytest>=7.0",
    "build>=1.0",
    "Flask>=3.0",
    "flask-smorest>=0.44",
    "marshmallow>=3.24.1,<5",
    "webargs>=8.3",
    "apispec>=6.3",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.scripts]
flaskit = "flaskit.cli:main"

[project.urls]
Homepage = "https://github.com/mghorbani2357/flaskit"
Documentation = "https://flaskit.readthedocs.io/"
Source = "https://github.com/mghorbani2357/flaskit"
Issues = "https://github.com/mghorbani2357/flaskit/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["flaskit*"]

[tool.setuptools.package-data]
flaskit = [
    "templates/**/*",
    "templates/project/*",
    "templates/project/python-version",
    "templates/project/templates/*",
    "templates/project/assets/*",
    "templates/project/assets/statics/*",
    "templates/project/assets/swagger-ui/*",
    "templates/module/*",
]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
